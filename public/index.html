<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok & Minecraft ServerTap - Panel de Control</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cliente Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body.widget-mode {
            background: transparent !important;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen">

    <!-- Contenedor dinámico según el modo activo (Dashboard vs Widget) -->
    <div id="app" class="p-6"></div>

    <!-- MODAL DE ÉXITO SERVERTAP -->
    <div id="success-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
        <div class="bg-gray-800 border-2 border-emerald-500 rounded-xl p-6 w-96 shadow-2xl space-y-4 text-left">
            <h3 class="text-xl font-bold text-white border-b border-gray-700 pb-2">Success</h3>
            <div class="space-y-2 text-sm text-gray-300">
                <p class="font-medium text-emerald-400">Connection successfully established!</p>
                <p id="modal-server-name">Server Name: Paper</p>
                <p id="modal-server-version">Server Version: 1.21.1</p>
            </div>
            <div class="flex justify-end pt-2">
                <button onclick="cerrarModalServerTap()" class="bg-gray-700 hover:bg-gray-600 text-white px-5 py-1.5 rounded-lg text-sm font-bold transition">
                    OK
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE GANADOR -->
    <div id="winner-popup" class="fixed inset-0 bg-black/85 flex items-center justify-center hidden z-50 transition-opacity duration-500 opacity-0">
        <div id="winner-content" class="bg-gradient-to-br from-gray-800 to-gray-900 border-4 border-yellow-400 rounded-2xl p-8 text-center shadow-2xl transform scale-70 transition-transform duration-500 max-w-md w-full">
            <h2 class="text-xl font-bold text-gray-300">¡Ganador de la Ronda!</h2>
            <div id="winner-avatar" class="w-24 h-24 rounded-full border-4 border-yellow-400 mx-auto my-4 overflow-hidden shadow-lg">
                <img src="" class="w-full h-full object-cover">
            </div>
            <h1 id="winner-name" class="text-3xl font-extrabold text-yellow-400 my-2">@username</h1>
            <p class="text-lg text-gray-300">Donó un total de <span id="winner-amount" class="text-white font-bold">0</span> 💎</p>
            <p class="text-2xl font-bold text-yellow-400 mt-3">¡Felicidades! 🏆</p>
        </div>
    </div>

    <script>
        // Configuración de la conexión Socket.io con tu servidor en Render
        const SOCKET_URL = "https://rivastik.onrender.com"; 
        const socket = io(SOCKET_URL);

        const urlParams = new URLSearchParams(window.location.search);
        const isWidget = urlParams.get('mode') === 'widget';
        const appContainer = document.getElementById('app');

        // Variables de Estado de la Subasta / Interacción
        let tiempoActual = 120;
        let intervalo = null;
        let participantes = {};
        let ganadoresHistorial = [];
        let isPaused = false;
        let snipeActivado = false;
        let subastaActiva = false;

        // Inicializar la vista correspondiente
        if (isWidget) {
            document.body.classList.add('widget-mode');
            renderWidgetView();
        } else {
            renderDashboardView();
        }

        // ==========================================
        // VISTA 1: DASHBOARD (Panel de Control Completo)
        // ==========================================
        function renderDashboardView() {
            appContainer.innerHTML = `
                <div class="max-w-7xl mx-auto space-y-6">
                    <!-- Cabecera -->
                    <header class="flex justify-between items-center bg-gray-800 p-4 rounded-xl shadow-lg border border-gray-700">
                        <div>
                            <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500">
                                🚀 TikTok & Minecraft ServerTap Panel
                            </h1>
                            <p class="text-xs text-gray-400 mt-1">Controla eventos interactivos en vivo y ServerTap.</p>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="copiarUrlWidget()" id="copiarUrlBtn" class="bg-yellow-500 hover:bg-yellow-600 text-black px-4 py-2 rounded-lg font-bold transition shadow text-sm">
                                📋 Copiar URL Widget
                            </button>
                            <button onclick="abrirVentanaWidget()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg font-semibold transition shadow text-sm">
                                Abrir Widget OBS
                            </button>
                            <button onclick="restart()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-semibold transition shadow text-sm">
                                Reiniciar / Finalizar
                            </button>
                        </div>
                    </header>

                    <!-- Layout de 3 Columnas -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        
                        <!-- Columna 1: Controles, Configuración ServerTap y Simulador -->
                        <div class="space-y-6">
                            
                            <!-- Control de Tiempo -->
                            <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700 space-y-4">
                                <h2 class="text-lg font-semibold text-pink-400">⏱️ Control de Tiempo</h2>
                                <div class="text-center bg-gray-900 p-4 rounded-lg border border-gray-700">
                                    <span id="tiempoRestante" class="text-4xl font-mono font-bold text-yellow-400">02:00</span>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs text-gray-400">Tiempo Inicial (s):</label>
                                        <input type="number" id="tiempo" value="120" class="w-full bg-gray-900 border border-gray-700 p-1.5 rounded text-sm text-center">
                                    </div>
                                    <div>
                                        <label class="text-xs text-gray-400">Snipe (s):</label>
                                        <input type="number" id="tiempoSnipe" value="15" class="w-full bg-gray-900 border border-gray-700 p-1.5 rounded text-sm text-center">
                                    </div>
                                </div>
                                <div class="flex gap-2 pt-2">
                                    <button onclick="iniciar()" class="flex-1 bg-green-600 hover:bg-green-700 py-2 rounded-lg font-bold text-sm">Iniciar</button>
                                    <button onclick="pausar()" class="flex-1 bg-yellow-600 hover:bg-yellow-700 py-2 rounded-lg font-bold text-sm">Pausar</button>
                                </div>
                            </div>

                            <!-- Configuración ServerTap & TikTok -->
                            <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700 space-y-4">
                                <h2 class="text-lg font-semibold text-emerald-400">⚡ Conexión ServerTap & TikTok</h2>
                                <div class="space-y-3 text-xs">
                                    <div>
                                        <label class="block font-bold text-gray-300 mb-1">🔑 ID Único (para Widget):</label>
                                        <input type="text" id="idUnico" placeholder="Ej: MiCanal" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-white">
                                    </div>
                                    <div>
                                        <label class="block font-bold text-gray-300 mb-1">Usuario de TikTok:</label>
                                        <input type="text" id="tiktokUser" placeholder="ej: felipe_rivas" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-white">
                                    </div>
                                    <div>
                                        <label class="block font-bold text-gray-300 mb-1">Player Name (Contexto):</label>
                                        <input type="text" id="playerName" value="loroteca" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-white">
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block font-bold text-gray-300 mb-1">IP Servidor:</label>
                                            <input type="text" id="serverIp" value="45.92.16.146" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-white">
                                        </div>
                                        <div>
                                            <label class="block font-bold text-gray-300 mb-1">Puerto:</label>
                                            <input type="number" id="serverPort" value="19018" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-white">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block font-bold text-gray-300 mb-1">Password (Auth Key):</label>
                                        <input type="password" id="serverPassword" value="lorotec123" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-white">
                                    </div>
                                    <button onclick="probarConexionServerTap()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-2 rounded-lg font-bold transition shadow text-xs">
                                        Probar Conexión ServerTap
                                    </button>
                                </div>
                            </div>

                            <!-- Simulador de Regalos -->
                            <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700 space-y-3">
                                <h3 class="text-sm font-semibold text-purple-400">🎮 Simular Regalo / Donación</h3>
                                <div class="space-y-2">
                                    <input type="text" id="sim-user" placeholder="Nombre usuario" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-xs text-white">
                                    <input type="number" id="sim-amount" placeholder="Cantidad diamantes" class="w-full bg-gray-900 border border-gray-700 p-2 rounded text-xs text-white">
                                    <button onclick="simularRegalo()" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg font-bold text-xs">Enviar Simulación</button>
                                </div>
                            </div>

                        </div>

                        <!-- Columna 2: Ranking en Vivo & Ganadores -->
                        <div class="space-y-6">
                            <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700 space-y-3 flex flex-col h-[400px]">
                                <h2 class="text-lg font-semibold text-pink-400">🏆 Participantes (Ronda Actual)</h2>
                                <div id="lista-scroll" class="flex-1 overflow-y-auto space-y-2 pr-1">
                                    <ul id="listaParticipantes" class="space-y-2"></ul>
                                </div>
                                <div class="p-2 bg-gray-900 rounded-lg text-xs border border-gray-700 space-y-1">
                                    <p>Total Participantes: <span id="totalParticipantes" class="font-bold text-yellow-400">0</span></p>
                                    <p>Diamantes Totales: <span id="totalDiamantes" class="font-bold text-pink-400">0</span></p>
                                </div>
                            </div>

                            <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700 space-y-3 h-[280px] overflow-y-auto">
                                <h2 class="text-lg font-semibold text-yellow-400">🏅 Historial de Ganadores</h2>
                                <ul id="listaGanadores" class="space-y-2 text-sm"></ul>
                            </div>
                        </div>

                        <!-- Columna 3: Historial / Consola de Eventos -->
                        <div class="bg-gray-800 p-5 rounded-xl shadow-lg border border-gray-700 space-y-4 flex flex-col h-[710px]">
                            <h2 class="text-lg font-semibold text-pink-400">📜 Historial de Eventos</h2>
                            <div id="logDonaciones" class="flex-1 overflow-y-auto space-y-2 text-xs font-mono p-3 bg-gray-900 rounded-lg border border-gray-700 text-gray-300">
                                <p class="text-gray-500">Sistema listo. Conecta TikTok y ServerTap para empezar.</p>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }

        // ==========================================
        // VISTA 2: WIDGET / OVERLAY TRANSPARENTE (OBS)
        // ==========================================
        function renderWidgetView() {
            appContainer.innerHTML = `
                <div id="widget-container" class="w-full h-screen flex flex-col justify-between p-4">
                    <div id="tiempoBox-widget" class="bg-gray-900/90 border-b-2 border-yellow-400 p-3 rounded-t-xl text-center shadow-lg">
                        <div id="tiempoRestante-widget" class="text-3xl font-mono font-bold text-yellow-400">02:00</div>
                        <div id="subtext-widget" class="text-xs text-gray-400 mt-1">El sorteo/subasta termina en</div>
                    </div>
                    <div id="participantes-widget" class="bg-gray-900/85 backdrop-blur-md p-3 rounded-b-xl border border-white/10 shadow-2xl flex-1 overflow-y-auto">
                        <ul id="listaParticipantes-widget" class="space-y-2"></ul>
                    </div>
                </div>
            `;
            
            // Unirse a la sala si viene el parámetro streamerId
            const streamerId = urlParams.get("streamerId");
            if (streamerId) {
                socket.emit("join_room", { streamerId, tiktokUser: "WidgetCliente" });
            }
        }

        // ==========================================
        // LÓGICA DE TEMPORIZADORES Y SOCKETS
        // ==========================================
        function iniciarTimerLogic() {
            let tiempoInput = document.getElementById("tiempo");
            if (tiempoActual <= 0) {
                tiempoActual = parseInt(tiempoInput ? tiempoInput.value : 120);
            }
            if (intervalo) clearInterval(intervalo);
            
            intervalo = setInterval(() => {
                if (!isPaused && tiempoActual > 0) {
                    tiempoActual--;
                    const formattedTime = formatTime(tiempoActual);
                    if (!document.body.classList.contains('widget-mode')) {
                        socket.emit('sync_time', tiempoActual);
                    }
                    if (document.getElementById('tiempoRestante')) {
                        document.getElementById('tiempoRestante').textContent = formattedTime;
                    }
                }
                
                if (tiempoActual <= 0 && !document.body.classList.contains('widget-mode')) {
                    clearInterval(intervalo);
                    intervalo = null;
                    terminarTiempo();
                }
            }, 1000);
        }

        function formatTime(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function iniciar() {
            if (!document.body.classList.contains('widget-mode')) {
                const idUnicoEl = document.getElementById('idUnico');
                const streamerId = idUnicoEl ? idUnicoEl.value.trim() : "";
                const tiktokUser = document.getElementById('tiktokUser').value.trim();

                if (!streamerId || !tiktokUser) {
                    alert("⚠️ Por favor completa el ID Único y tu usuario de TikTok.");
                    return;
                }

                socket.emit("join_room", { streamerId, tiktokUser });
                snipeActivado = false;
                subastaActiva = true;
                socket.emit("iniciar_subasta");
                isPaused = false;
                tiempoActual = 0;
                iniciarTimerLogic();
                
                const log = document.getElementById('logDonaciones');
                if (log) log.innerHTML += `<p class="text-yellow-400">▶️ Ronda iniciada correctamente.</p>`;
            }
        }

        function pausar() {
            isPaused = !isPaused;
            const log = document.getElementById('logDonaciones');
            if (isPaused) {
                if (log) log.innerHTML += `<p class="text-orange-400">⏸️ Temporizador en pausa.</p>`;
            } else {
                iniciarTimerLogic();
                if (log) log.innerHTML += `<p class="text-green-400">▶️ Temporizador reanudado.</p>`;
            }
        }

        function terminarTiempo() {
            const tiempoSnipe = parseInt(document.getElementById("tiempoSnipe").value) || 0;
            if (!snipeActivado && tiempoSnipe > 0) {
                snipeActivado = true;
                tiempoActual = tiempoSnipe;
                socket.emit("iniciar_snipe_cliente", tiempoSnipe);
                socket.emit("activar_alerta_snipe_visual");
                iniciarTimerLogic();
            } else {
                socket.emit("subasta_terminada_total");
                procesarGanador();
            }
        }

        function procesarGanador() {
            const participantesArray = Object.values(participantes);
            if (participantesArray.length > 0) {
                participantesArray.sort((a, b) => parseInt(b.cantidad) - parseInt(a.cantidad));
                const ganador = participantesArray[0];
                ganadoresHistorial.unshift(ganador);
                actualizarGanadoresUI();
                socket.emit("anunciar_ganador", ganador);
            }
        }

        function restart() {
            if (intervalo) clearInterval(intervalo);
            tiempoActual = 0;
            subastaActiva = false;
            snipeActivado = false;
            participantes = {};
            actualizarParticipantesUI();
            socket.emit('sync_time', 0);
            socket.emit("subasta_terminada_total");
            socket.emit("limpiar_listas");
            const log = document.getElementById('logDonaciones');
            if (log) log.innerHTML += `<p class="text-cyan-400">🔄 Sistema reiniciado por completo.</p>`;
        }

        function actualizarParticipantesUI() {
            const participantesArray = Object.values(participantes);
            participantesArray.sort((a, b) => parseInt(b.cantidad) - parseInt(a.cantidad));

            let totalDiamantes = 0;
            const listaDashboard = document.getElementById("listaParticipantes");
            const listaWidget = document.getElementById("listaParticipantes-widget");
            
            if (listaDashboard) listaDashboard.innerHTML = "";
            if (listaWidget) listaWidget.innerHTML = "";

            participantesArray.forEach((p, index) => {
                totalDiamantes += parseInt(p.cantidad) || 0;
                const itemHTML = `
                    <li class="flex items-center justify-between bg-gray-900 p-2.5 rounded-lg border border-gray-700 text-sm">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="font-bold text-yellow-400">#${index + 1}</span>
                            <img src="${p.avatar_url || 'https://via.placeholder.com/30'}" class="w-7 h-7 rounded-full object-cover border border-purple-500">
                            <span class="truncate text-white font-medium">${p.usuario}</span>
                        </div>
                        <span class="text-pink-400 font-bold">${p.cantidad} 💎</span>
                    </li>
                `;
                if (listaDashboard && !document.body.classList.contains('widget-mode')) listaDashboard.innerHTML += itemHTML;
                if (listaWidget && document.body.classList.contains('widget-mode')) listaWidget.innerHTML += itemHTML;
            });

            if (!document.body.classList.contains('widget-mode')) {
                const totalPartEl = document.getElementById('totalParticipantes');
                const totalDiamEl = document.getElementById('totalDiamantes');
                if (totalPartEl) totalPartEl.textContent = participantesArray.length;
                if (totalDiamEl) totalDiamEl.textContent = totalDiamantes;
            }
        }

        function actualizarGanadoresUI() {
            const lista = document.getElementById('listaGanadores');
            if (!lista) return;
            lista.innerHTML = "";
            ganadoresHistorial.forEach(g => {
                const li = document.createElement('li');
                li.className = "p-2 bg-gray-900 rounded border border-gray-700 flex justify-between";
                li.innerHTML = `<span class="text-yellow-400 font-bold">🏆 ${g.usuario}</span> <span class="text-pink-400">${g.cantidad} 💎</span>`;
                lista.appendChild(li);
            });
        }

        // ==========================================
        // SERVERTAP Y SIMULACIÓN
        // ==========================================
        function probarConexionServerTap() {
            const ip = document.getElementById('serverIp').value.trim();
            const port = document.getElementById('serverPort').value.trim();
            const password = document.getElementById('serverPassword').value.trim();
            const playerName = document.getElementById('playerName').value.trim();

            if (!ip || !port || !password) {
                alert("⚠️ Completa IP, Puerto y Contraseña de ServerTap.");
                return;
            }

            const log = document.getElementById('logDonaciones');
            if (log) log.innerHTML += `<p class="text-yellow-400">⚡ Probando conexión ServerTap con ${ip}:${port}...</p>`;
            
            socket.emit('probar-servertap', { ip, port, password, playerName });
        }

        socket.on('servertap-success', (data) => {
            document.getElementById('modal-server-name').innerText = `Server Name: ${data.serverName || 'Paper'}`;
            document.getElementById('modal-server-version').innerText = `Server Version: ${data.version || '1.21.1'}`;
            document.getElementById('success-modal').classList.remove('hidden');
        });

        socket.on('servertap-error', (err) => {
            alert(`❌ Error ServerTap: ${err.message || 'Verifica los datos de conexión.'}`);
        });

        function cerrarModalServerTap() {
            document.getElementById('success-modal').classList.add('hidden');
        }

        function simularRegalo() {
            const user = document.getElementById('sim-user').value.trim() || "TestUser";
            const amount = parseInt(document.getElementById('sim-amount').value) || 10;
            socket.emit('simular-regalo', { user, amount });
        }

        function copiarUrlWidget() {
            const streamerId = document.getElementById('idUnico').value.trim();
            if (!streamerId) {
                alert('Introduce el ID Único del Streamer primero.');
                return;
            }
            const widgetURL = `${SOCKET_URL}/widget?streamerId=${streamerId}`;
            navigator.clipboard.writeText(widgetURL).then(() => {
                const btn = document.getElementById('copiarUrlBtn');
                btn.innerText = '✅ ¡Copiado!';
                setTimeout(() => btn.innerText = '📋 Copiar URL Widget', 2000);
            });
        }

        function abrirVentanaWidget() {
            const streamerId = document.getElementById('idUnico').value.trim();
            const targetUrl = streamerId ? `${SOCKET_URL}/widget?streamerId=${streamerId}` : `${window.location.pathname}?mode=widget`;
            window.open(targetUrl, '_blank', 'width=450,height=700');
        }

        // ==========================================
        // LISTENERS DE SOCKETS GLOBALES
        // ==========================================
        socket.on('update_time', (time) => {
            if (document.body.classList.contains('widget-mode')) {
                const widgetTimer = document.getElementById('tiempoRestante-widget');
                if (widgetTimer) widgetTimer.textContent = formatTime(time);
            }
        });

        socket.on("update_participantes", (lista) => {
            participantes = lista;
            actualizarParticipantesUI();
        });

        socket.on("new_gift", (data) => {
            const log = document.getElementById('logDonaciones');
            if (log) {
                log.innerHTML += `<p class="text-cyan-400">🎁 ${data.nickname} envió ${data.giftName} (${data.diamondCount} 💎)</p>`;
                log.scrollTop = log.scrollHeight;
            }
        });

        socket.on("anunciar_ganador", (ganador) => {
            if (!ganador || !ganador.usuario) return;
            const popup = document.getElementById('winner-popup');
            if (popup) {
                document.getElementById('winner-name').textContent = `@${ganador.usuario}`;
                document.getElementById('winner-amount').textContent = ganador.cantidad;
                document.getElementById('winner-avatar').querySelector('img').src = ganador.avatar_url || 'https://via.placeholder.com/100';
                popup.classList.remove('hidden');
                setTimeout(() => {
                    popup.classList.remove('opacity-0');
                    document.getElementById('winner-content').classList.remove('scale-70');
                }, 10);

                setTimeout(() => {
                    popup.classList.add('opacity-0');
                    document.getElementById('winner-content').classList.add('scale-70');
                    setTimeout(() => popup.classList.add('hidden'), 500);
                }, 8000);
            }
        });
    </script>
</body>
</html>
